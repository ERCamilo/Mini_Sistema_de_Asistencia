# Mini: unit + wiring tests and browser regressions; tutorial replay is opt-in temporarily.
# Main is production (GitHub Pages), so nothing merges without this green.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tutorials:
        description: Include temporarily paused tutorial replay
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release version and notes
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$RELEASE_BASE" ] && [ "$RELEASE_BASE" != 0000000000000000000000000000000000000000 ]; then
            node scripts/release-manifest.cjs --check --release --base "$RELEASE_BASE" --head "$RELEASE_HEAD"
          else
            node scripts/release-manifest.cjs --check --release --head "$RELEASE_HEAD"
          fi

      - name: Install isolated private TURN tool typings
        run: npm install --prefix "$RUNNER_TEMP/private-turn-types" --no-package-lock --ignore-scripts --no-audit --no-fund @types/node@22.10.2
      - name: Compile private TURN test tool
        run: ./node_modules/.bin/tsc -p scripts/private-turn/tsconfig.json --typeRoots "$RUNNER_TEMP/private-turn-types/node_modules/@types" --outDir "$RUNNER_TEMP/private-turn-tool"
      - name: Export private TURN test tool output
        run: echo "PRIVATE_TURN_TOOL_OUTPUT=$RUNNER_TEMP/private-turn-tool" >> "$GITHUB_ENV"
      - run: npm test

  tutorials:
    name: Tutoriales (modo prueba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser/axe tools are installed globally, never runtime dependencies.
      - run: npm install -g playwright@1.56.1 axe-core@4.14.0
      - run: playwright install --with-deps chromium
      # Temporary: automatic runs keep browser regressions but skip tutorial replay.
      # Manual run_tutorials=true restores the unchanged full local command.
      - name: Browser regressions (tutorial replay opt-in)
        env:
          RUN_TUTORIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tutorials == true }}
        run: |
          export AXE_PATH="$(npm root -g)/axe-core/axe.min.js"
          if [ "$RUN_TUTORIALS" = "true" ]; then
            npm run test:e2e
          else
            npm run test:e2e:ci
          fi
      - name: Connections browser regressions
        run: |
          export PLAYWRIGHT_MODULE="$(npm root -g)/playwright/index.mjs"
          npm run test:e2e:connections
