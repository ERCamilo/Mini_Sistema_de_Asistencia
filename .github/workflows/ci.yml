# Mini: unit + wiring tests, and every tutorial run in test mode on the real app.
# Main is production (GitHub Pages), so nothing merges without this green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  tutorials:
    name: Tutoriales (modo prueba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser/axe tools are installed globally, never runtime dependencies.
      - run: npm install -g playwright@1.56.1 axe-core@4.14.0
      - run: playwright install --with-deps chromium
      - run: AXE_PATH="$(npm root -g)/axe-core/axe.min.js" npm run test:e2e
