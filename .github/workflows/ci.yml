# Mini: unit + wiring tests and browser regressions; tutorial replay is opt-in temporarily.
# Main is production (GitHub Pages), so nothing merges without this green.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tutorials:
        description: Include temporarily paused tutorial replay
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  tutorials:
    name: Tutoriales (modo prueba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser/axe tools are installed globally, never runtime dependencies.
      - run: npm install -g playwright@1.56.1 axe-core@4.14.0
      - run: playwright install --with-deps chromium
      # Temporary: automatic runs keep browser regressions but skip tutorial replay.
      # Manual run_tutorials=true restores the unchanged full local command.
      - name: Browser regressions (tutorial replay opt-in)
        env:
          RUN_TUTORIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tutorials == true }}
        run: |
          export AXE_PATH="$(npm root -g)/axe-core/axe.min.js"
          if [ "$RUN_TUTORIALS" = "true" ]; then
            npm run test:e2e
          else
            npm run test:e2e:ci
          fi
