# Mini: unit + wiring tests, and every tutorial run in test mode on the real app.
# Main is production (GitHub Pages), so nothing merges without this green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  tutorials:
    name: Tutoriales (modo prueba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is test tooling only: installed globally, never a dependency.
      - run: npm install -g playwright@1.56.1
      - run: playwright install --with-deps chromium
      - run: npm run test:e2e
